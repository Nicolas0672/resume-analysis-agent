  />

  <!-- R kick leg -->
  <path
    d="M17 18.75L24.75 27.5"
    stroke="#ffffff"
    stroke-width="3.08"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Evidence datum point -->
  <circle
    cx="18.35"
    cy="12.6"
    r="3.08"
    fill="#10b981"
  />

  <circle
    cx="18.35"
    cy="12.6"
