
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="0.5" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded logo container -->
  <rect
    x="0.5"
    y="0.5"
    width="33"
    height="33"
    rx="9"
    fill="url(#bg)"
    stroke="#292524"
    stroke-width="1"
  />

  <!-- Architectural hairline ledger datum lines -->
  <line
    x1="4"
    y1="12.75"
    x2="7.5"
    y2="12.75"
    stroke="#ffffff"
    stroke-opacity="0.25"
    stroke-width="1"
    stroke-dasharray="1 1"
  />

  <line
    x1="19.75"
    y1="3.5"
    x2="19.75"
    y2="6.5"
    stroke="#ffffff"
    stroke-opacity="0.25"
    stroke-width="1"
    stroke-dasharray="1 1"
  />

  <!-- R spine -->
  <path
    d="M9.25 6.5V27.5"
    stroke="#ffffff"
    stroke-width="3.08"
    stroke-linecap="round"
  />

  <!-- R bowl -->
  <path
    d="M9.25 6.5H18.35C22.27 6.5 24.75 8.88 24.75 12.6C24.75 16.32 22.27 18.75 18.35 18.75H9.25"
    stroke="#ffffff"
    stroke-width="3.08"
    stroke-linecap="round"
