name: CI

on:
  pull_request:
    branches: ["main"]
  
jobs:
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        # installing dependencies via uv. same as requirements.txt but easier
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest