name: CI

on:
  pull_request:
    branches: ["main"]
  
jobs:
  backend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install dependencies
        # installing dependencies via uv. same as requirements.txt but easier
        working-directory: ./backend
        run: uv sync --locked
      - name: Run tests
        working-directory: ./backend
        run: uv run pytest